  model_bin_path: outputs/models/svm_binary.joblib
  model_multi_path: outputs/models/svm_multiclass.joblib
  multi_thr: 0.3
  svm_params:
    C_bin: 5.0
    C_multi: 5.0
    class_weight: balanced
    gamma_bin: scale
    gamma_multi: scale
    kernel: rbf
    probability: true
