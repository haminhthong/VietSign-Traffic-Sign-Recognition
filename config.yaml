dataset:
  phash_thresh: 8
  random_seed: 42
  train_ratio: 0.7
  val_ratio: 0.15

paths:
  data_processed: data/processed
  data_raw: data/raw
  outputs: outputs

task1:
  median_kernel: 3
  tile_grid_size: [8, 8]

task2:
  # Bộ ngưỡng này được dùng cho HSV preset 1 trong candidate engine.
  red_lower1: [0, 50, 50]
  red_upper1: [15, 255, 255]
  red_lower2: [162, 50, 50]
  red_upper2: [180, 255, 255]
  yellow_lower: [14, 50, 50]
  yellow_upper: [38, 255, 255]
  blue_lower: [88, 50, 50]
  blue_upper: [132, 255, 255]
  achromatic_dilate_ksize: 9
  fill_holes: true
  hsv_set: 1
  include_achromatic: false
  union_hsv_sets: true

task2_union:
  canny_high_used: 150
  canny_low_used: 50
  hsv_ar_range: [0.4, 2.5]
  hsv_min_extent: 0.15
  hsv_set_used: 1
  mser_ar_range: [0.6, 1.6]
  mser_delta_used: 5
  mser_min_extent: 0.15
  nms_iou_thresh: 0.4

task3_shape:
  circle:
    dp: 1.2
    max_radius: 74
    min_dist: 25
    min_radius: 6
    param1: 120
    param2: 40
    min_color_ratio: null
  rectangle:
    angle_tol: 45
    approx_eps_ratio: 0.1
    max_aspect: 2.5
    min_area: 200
    min_extent: 0.65
  triangle:
    approx_eps_ratio: 0.12
    max_side_ratio: 3.0
    min_angle_deg: 12
    min_area: 150
    min_red_ratio: 0.05
    min_yellow_fill: 0.0

task4:
  max_aspect_ratio: 1.9
  min_aspect_ratio: 0.4
  min_h: 12
  min_w: 12
  nms_iou_threshold: 0.4
  resize: [64, 64]

task5:
  hog_params:
    cells_per_block: [2, 2]
    orientations: 9
    pixels_per_cell: [8, 8]

task6:
  bin_thr: 0.5
  multi_thr: 0.3
  model_bin_path: outputs/models/svm_binary.joblib
  model_multi_path: outputs/models/svm_multiclass.joblib
