    -> 2.0 | std>=100 -> 1.0 ; tileGridSize=(8,8)'
  clip_limit: 2.0
  median_kernel: 3
  method: median
  note: Dùng Median Filter + Dynamic CLAHE (thay Gaussian)
  sigma: 1.0
  tile_grid_size:
  - 8
  - 8
