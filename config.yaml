dataset:
  random_seed: 42
  train_ratio: 0.7
  val_ratio: 0.15

paths:
  data_raw: data/raw
  data_processed: data/processed
  outputs: outputs

preprocessing:
  median_kernel: 3
  clahe_clip_limit: 2.0
  tile_grid_size: [8, 8]

candidate:
  # Ngưỡng màu HSV chuẩn cho biển báo Việt Nam (Đỏ, Vàng, Xanh dương)
  red_lower1: [0, 50, 50]
  red_upper1: [15, 255, 255]
  red_lower2: [162, 50, 50]
  red_upper2: [180, 255, 255]
  yellow_lower: [14, 50, 50]
  yellow_upper: [38, 255, 255]
  blue_lower: [88, 50, 50]
  blue_upper: [132, 255, 255]
  min_area: 150
  max_area_ratio: 0.35
  min_extent: 0.20
  aspect_ratio_range: [0.4, 2.5]
  nms_iou_threshold: 0.4

shape:
  # Xác minh hình học: Độ tròn (circularity = 4*pi*Area / Perimeter^2)
  min_circularity: 0.65
  # Tam giác xấp xỉ 3 đỉnh
  triangle_min_angle: 12.0
  triangle_max_side_ratio: 4.0
  # Chữ nhật xấp xỉ 4 đỉnh
  rectangle_min_extent: 0.65
  rectangle_max_aspect: 2.5

roi:
  min_w: 12
  min_h: 12
  min_aspect_ratio: 0.4
  max_aspect_ratio: 2.5
  resize: [64, 64]
  nms_iou_threshold: 0.4

hog:
  orientations: 9
  pixels_per_cell: [8, 8]
  cells_per_block: [2, 2]

classifier:
  model_bin_path: outputs/models/svm_binary.joblib
  model_multi_path: outputs/models/svm_multiclass.joblib
  bin_confidence_threshold: 0.5
  multi_confidence_threshold: 0.3
