[project]
name = "vietsign-vision"
version = "1.0.0"
description = "Explainable Vietnamese traffic sign detection and recognition using classical computer vision, HOG and a two-stage SVM."
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["computer-vision", "traffic-sign", "hog", "svm", "opencv", "vietnam"]
dependencies = [
  "opencv-python>=4.8,<5",
  "numpy>=1.24,<2",
  "scikit-learn>=1.3,<1.11",
  "scikit-image>=0.21,<1",
  "PyYAML>=6,<7",
  "Pillow>=10,<11",
  "joblib>=1.3,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.scripts]
vietsign = "src.cli:main"
vietsign-audit = "src.audit:main"

[project.optional-dependencies]
notebooks = [
  "pandas>=2,<3",
  "matplotlib>=3.7,<4",
  "imagehash>=4.3,<5",
  "tqdm>=4.65,<5",
  "jupyter>=1",
  "ipykernel>=6.25",
]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
